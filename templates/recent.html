{% extends "base.html" %}
{% block main %}
<article class="recent-index">
<h1 class="page-title">{{ page.title }}</h1>
<p class="page-meta">更新日の新しい順・{{ pages|length }} ページ</p>
<ul class="page-list">
{% for p in pages %}
<li><a href="{{ p.href }}">{{ p.title }}</a> <time datetime="{{ p.updated }}">{{ p.updated }}</time></li>
{% endfor %}
</ul>
</article>
{% endblock %}
