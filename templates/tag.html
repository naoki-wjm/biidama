{% extends "base.html" %}
{% block main %}
<article class="tag-index">
<h1 class="page-title">{{ page.title }}</h1>
<p class="page-meta">{{ pages|length }} ページ</p>
<ul class="page-list">
{% for p in pages %}
<li><a href="{{ p.href }}">{{ p.title }}</a>{% if p.created %} <time datetime="{{ p.created }}">{{ p.created }}</time>{% endif %}</li>
{% endfor %}
</ul>
</article>
{% endblock %}
