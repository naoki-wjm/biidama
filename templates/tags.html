{% extends "base.html" %}
{% block main %}
<article class="tag-list">
<h1 class="page-title">{{ page.title }}</h1>
<p class="page-meta">{{ tags|length }} 種（多い順）</p>
<ul class="tag-cloud">
{% for t in tags %}
<li><a href="{{ t.href }}">#{{ t.name }}</a> <span class="count">{{ t.count }}</span></li>
{% endfor %}
</ul>
</article>
{% endblock %}
