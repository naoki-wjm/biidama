# biidama の設定（見本）。実物は config.local.yml に置く（.gitignore 済み）
#   python -m biidama build -c config.local.yml

# 保管庫の場所（Obsidian の vault のルート）
vault: /path/to/vault

# 出力先（相対パスは設定ファイルの場所から）
out: ./out

# 走査前にまるごと除外するフォルダ（保管庫ルートからの相対パス）
# 非公開しかないフォルダを列挙して走査を軽くする。ここに無くても publish: true が無ければ出ない
exclude:
  - .obsidian
  - .trash
  - templates

# メディア（画像・音源・動画）のフォルダ（保管庫ルートからの相対パス）。中身はそのまま出力へ複製され、
# 原稿の ![[絵.png]] はここから探す。無ければ行ごと消す（その時 ![[ ]] は止まる）
media:
  dir: メディア
  # 表示用の縮小版（WebP）の長辺の上限（px）。押すと元画像が開く。0 なら作らず元画像をそのまま表示
  thumbnail: 1200
  quality: 80

site:
  # 見出しとタブに出るサイト名
  name: サイト名
  # サイトの URL（末尾スラッシュ）。OGP の og:url と og:image に使う
  url: https://example.com/
  # サイトの絵（static/ の中に置く。ファビコン・OGP 画像・ヘッダーの印。正方形 512px の PNG が目安）。無ければ行ごと消す
  icon: static/icon.png
  # ブラウザの枠の色（<meta name="theme-color">）。無ければ行ごと消す
  theme_color: "#4aa0d2"
  # head にそのまま入れる行。作者宣言や検証用の meta など、道具に書きたくないものはここに
  head_extra:
    - '<meta name="fediverse:creator" content="@you@example.social">'
  # 「最近の更新」一覧（最近の更新.html）の件数。0 なら作らない
  recent: 20
  # 同じ一覧をトップページの末尾に何件出すか。0 なら出さない
  recent_home: 5
